<title>JolSathi · JolBank</title>

<style>
:root{--teal:#0099B4;--cyan:#9EECF2;--lc:#E3F8FA;--peach:#FDE9D4;--grey:#555555;--ink:#000;--line:#E3E7EA;--bg:#F7FAFB;
--green:#22A06B;--yellow:#E2A400;--red:#E5484D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;color:var(--ink);background:#E9F4F6;display:flex;justify-content:center}
button,input,select{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:520px){.app{min-height:calc(100vh - 32px);margin:16px 0;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,60,80,.18)}}
header{background:#fff;border-bottom:3px solid var(--teal);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:40px}
header .ttl{flex:1;min-width:0}header .ttl b{display:block;font-size:17px}header .ttl small{color:var(--grey);font-size:12px}
.hb{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--grey)}
.net{font-size:11px;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--lc);color:var(--teal);white-space:nowrap}
.net.off{background:var(--peach);color:#8A5A1E}
main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.c{background:#fff;border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.c h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--grey)}.sm{font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:13px;font-weight:800;width:100%;font-size:15px;background:var(--teal);color:#fff}
.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}
.role{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.role span{font-size:30px}.role b{display:block}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}.it .f{flex:1}
.big{width:120px;height:120px;border-radius:50%;margin:4px auto 8px;display:grid;place-items:center;font-size:52px;color:#fff}
.state{font-size:22px;font-weight:800;text-align:center}
.note{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--lc)}.note.w{background:var(--peach)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--teal);background:var(--lc)}
nav[hidden]{display:none}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 8px);position:sticky;bottom:0}
nav button{flex:1;border:0;background:none;color:#8A9399;font-size:11px;font-weight:700}nav button b{display:block;font-size:20px}nav button.on{color:var(--teal)}
.badge{background:var(--red);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:.92}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--lc)}
.sms{background:#EEF1F3;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;margin-bottom:6px}
.foot{text-align:center;font-size:12px;color:var(--grey);padding:4px 0 10px}
.foot a{color:var(--teal)}
</style>

function demo(){

 const H=(n,mix)=>Array.from({length:n},(_,i)=>({card:100+i,prio:mix[i%mix.length],used:Math.round(Math.random()*90)}));

 s[0].orders=[{card:112,jars:2,st:'new'},{card:107,jars:1,st:'new'}];s[0].levyJars=128;
 s[0].tasks=[{id:1,k:'meter',st:'done',photo:'',ts:'Tue 10:42',gps:'22.71 N, 89.07 E',q:'sent'}];
 return {lang:'en',role:null,site:null,tab:0,off:false,min:false,sites:s,paid:[{n:'Rahima',a:4333,f:'Monthly pay'}],nextId:10};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||demo()}catch(e){S=demo()}
Object.assign(S,{role:null,site:null,tab:0,hsite:null});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const t=k=>(T[S.lang][k]??T.en[k]??k);
const site=()=>S.sites.find(x=>x.id===S.site);
const C={GREEN:'var(--green)',YELLOW:'var(--yellow)',RED:'var(--red)'};

/* ---------- colour rules: the worst of the checks ---------- */
function status(s){
 const x=s.tests[s.tests.length-1]||{},lab=s.lab[s.lab.length-1],iss=[];
 const ars=lab&&lab.ars!=null?lab.ars:x.ars;
 if(ars>=50)iss.push(['r','iss_ars_r']);else if(ars>=25)iss.push(['y','iss_ars_y']);
 if(x.vial==='b'||(lab&&lab.coli>0))iss.push(['r','iss_germ']);
 if(x.ec>=2000)iss.push(['r','iss_salt_r']);else if(x.ec>=1500)iss.push(['y','iss_salt_y']);
 if(s.days<14)iss.push(['r','iss_bank_r']);else if(s.days<30)iss.push(['y','iss_bank_y']);
 if(s.flow<50)iss.push(['r','iss_filt_r']);else if(s.flow<75)iss.push(['y','iss_filt_y']);
 if(x.pond>1500||x.ntu>10)iss.push(['y','iss_pond']);
 const c=iss.some(i=>i[0]=='r')?'RED':iss.some(i=>i[0]=='y')?'YELLOW':'GREEN';
 return{c,iss,ars};
}
const capOf=s=>Math.round(s.inf*365*s.rec/(0.015*365));
function jobsFor(s){const st=status(s),j=[];
 st.iss.forEach(([lv,k])=>{const m={iss_filt_y:'Wash the fabric mat',iss_filt_r:'Full filter clean',iss_ars_y:'Send lab sample within a week',iss_ars_r:'Stop drinking use; call supervisor',iss_germ:'Chlorinate and call supervisor',iss_bank_y:'Drinking use only; no jar sales',iss_bank_r:'Lower the weekly limit',iss_salt_y:'Drinking use only',iss_salt_r:'Stop drinking use',iss_pond:'Keep the recharge valve shut'}[k];j.push({lv,title:m,k})});
 return j}

/* ---------- ui helpers ---------- */
const $=id=>document.getElementById(id);
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function go(o){Object.assign(S,o);save();render()}
const pend=()=>S.sites.reduce((a,s)=>a+s.tasks.filter(x=>x.q==='pending').length+(s.tests.filter(x=>x.q==='pending').length),0);
function syncNow(){S.sites.forEach(s=>{s.tasks.forEach(x=>{if(x.q==='pending')x.q='sent'});s.tests.forEach(x=>{if(x.q==='pending')x.q='sent'})})}
window.addEventListener('online',()=>{if(!S.off){syncNow();save();render();toast(t('synced'))}});
const isOff=()=>S.off||!navigator.onLine;

function header(){
 const r=S.role,s=site();
 $('hdr').innerHTML=`${r?`<button class="hb" onclick="back()">‹</button>`:''}<img src="assets/jolsathi-logo.png" alt="JolSathi">
 <div class="ttl">${r?`<b>${t(r)}${s&&r!=='hub'?' · '+s.id:''}</b><small>${s&&r!=='hub'?s.dist:'JolBank'}</small>`:''}</div>
 ${r&&r!=='family'&&r!=='hub'?`<span class="net ${isOff()?'off':''}" onclick="toggleNet()">${isOff()?t('offline'):t('online')}${pend()?' · '+pend()+' '+t('pending'):''}</span>`:''}
 <button class="hb" onclick="go({lang:S.lang==='en'?'bn':'en'})">${S.lang==='en'?'বাংলা':'EN'}</button>`}
function back(){if(S.site&&S.role!=='hub'&&S.role!=='supervisor'&&S.role)go({site:null,tab:0});else go({role:null,site:null,tab:0})}
function toggleNet(){S.off=!S.off;if(!S.off){syncNow();toast(t('synced'))}save();render()}
function navs(list){const n=$('nav');n.hidden=!list;if(!list)return;n.innerHTML=list.map((x,i)=>`<button class="${S.tab===i?'on':''}" onclick="go({tab:${i}})"><b>${x[0]}</b>${t(x[1])}</button>`).join('')}

/* ---------- screens ---------- */
function welcome(){navs(null);return `<div class="c" style="text-align:center"><img src="assets/jolbank-logo.png" style="width:170px"><div class="mut sm" style="margin-top:6px">${t('tag')}</div></div>
<div class="c"><h3>${t('who')}</h3><div style="display:flex;flex-direction:column;gap:8px">
${[['family','👪'],['caretaker','🧰'],['supervisor','🧑‍💼'],['vendor','🚲'],['hub','🗺️']].map(([r,e])=>`<button class="role" onclick="go({role:'${r}',tab:0,site:${r==='hub'?"'ALL'":'null'}})"><span>${e}</span><div><b>${t(r)}</b><div class="sm mut">${t(r+'P')}</div></div></button>`).join('')}</div></div>
<div class="note">${t('demo')}</div><div class="foot"><a href="#" onclick="if(confirm('Reset?')){S=demo();save();render()}return false">${t('reset')}</a></div>`}
function pick(){navs(null);return `<div class="c"><h3>${t('pick')}</h3>${S.sites.map(s=>{const st=status(s);return `<div class="it" onclick="go({site:'${s.id}',tab:0})" style="cursor:pointer"><span class="dot" style="background:${C[st.c]}"></span><div class="f"><b>${s.id}</b> <span class="sm mut">· ${s.dist}</span></div><span class="chip" style="background:${C[st.c]}">${t(st.c)}</span></div>`}).join('')}</div>`}

function family(){const s=site(),st=status(s);navs([['🏠','home'],['🫙','jars'],['৳','moneyT']]);
 if(S.tab===0){const x=s.tests[s.tests.length-1],me=s.hh[12]||{used:60},msg={GREEN:'safe',YELLOW:'limit',RED:'stop'}[st.c],ic={GREEN:'✓',YELLOW:'!',RED:'✕'}[st.c];
  const near=S.sites.filter(o=>o.id!==s.id&&status(o).c==='GREEN'&&o.dist===s.dist)[0]||S.sites.find(o=>status(o).c==='GREEN');
  const pct=Math.min(100,s.days/60*100);return `<div class="c"><div class="row"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="46" fill="none" stroke="#E3E7EA" stroke-width="12"/><circle cx="56" cy="56" r="46" fill="none" stroke="${C[st.c]}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${pct*2.89} 289" transform="rotate(-90 56 56)"/><text x="56" y="58" text-anchor="middle" font-size="28" font-weight="800">${s.days}</text><text x="56" y="76" text-anchor="middle" font-size="10" fill="#555">${S.lang==="bn"?"দিন":"days"}</text></svg><div><span class="chip" style="background:${C[st.c]}">${ic} ${t(st.c)}</span><div class="state" style="text-align:left;margin-top:6px">${t(msg)}</div></div></div>${st.iss.map(i=>`<div class="note w" style="margin-top:8px">${t(i[1])}</div>`).join('')}</div>
  ${st.c==='RED'?`<div class="c"><h3>${t('safeHere')}</h3><div class="it"><span class="dot" style="background:var(--green)"></span><div class="f"><b>${near.id}</b> <span class="sm mut">· ${near.dist}</span></div></div><div class="it">🚲<div class="f sm">${t('vendorDel')}</div></div></div>`:''}
  <div class="c"><h3>${t('tested')}</h3><div class="row">${[['salt',x.ec<1500],['germs',x.vial!=='b'],['ars',(st.ars||0)<25]].map(([k,ok])=>`<span class="chip" style="background:${ok?'var(--green)':'var(--red)'}">${ok?'✓':'✕'} ${t(k)}</span>`).join('')}</div></div>
  <div class="c"><div class="row sp"><h3 style="margin:0">${t('share')}</h3><b>105 L</b></div><div class="sm mut" style="margin:4px 0 8px">${t('perDay')}</div><div class="bar"><i style="width:${Math.min(100,me.used/105*100)}%"></i></div><div class="sm mut" style="margin-top:6px">${me.used} L ${t('used')}</div></div>
  <div class="c"><h3>📱 ${t('smsTitle')}</h3><div class="sms">JolBank: ${s.id} ${t(st.c)}. ${t(msg)}.${st.c==='RED'?' → '+near.id:''}</div></div>`}
 if(S.tab===1){const ok=st.c==='GREEN';return `<div class="c"><h3>🫙 ${t('order')}</h3>${ok?'':`<div class="note w">${t('paused')}</div>`}<div style="margin-top:10px"><button class="btn" ${ok?'':'disabled'} onclick="orderJar()">${t('order')}</button></div></div>
  <div class="c"><h3>${t('myOrders')}</h3>${s.orders.filter(o=>o.card===112).map(o=>`<div class="it"><div class="f">${o.jars} × 20 L</div><span class="chip" style="background:${o.st==='done'?'var(--green)':'var(--grey)'}">${o.st==='done'?'✓':'…'}</span></div>`).join('')||`<div class="sm mut">${t('none')}</div>`}</div>`}
 return moneyCard()}
function moneyCard(){const rows=[['fees',20,'#0099B4'],['levy',12,'#9EECF2'],['donors',16,'#FDE9D4'],['pub',52,'#555555']];
 return `<div class="c"><h3>${t('money')} · ${t('in')}</h3>${rows.map(r=>`<div class="it"><span class="dot" style="background:${r[2]};border:1px solid #ccc"></span><div class="f">${t(r[0])}</div><b>${r[1]}%</b></div>`).join('')}
 <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:6px">${rows.map(r=>`<i style="width:${r[1]}%;background:${r[2]}"></i>`).join('')}</div></div>
 <div class="c"><h3>${t('out')}</h3>${S.paid.slice(-4).reverse().map(p=>`<div class="it"><div class="f">${p.f} · ${p.n}</div><b>Tk ${p.a.toLocaleString()}</b></div>`).join('')}</div><div class="note">${t('pool')}</div>`}
function orderJar(){const s=site();s.orders.push({card:112,jars:1,st:'new'});save();render();toast('✓')}

function caretaker(){const s=site();navs([['📋','today'],['🧪','tests'],['৳','pay']]);
 if(S.tab===0){const jobs=jobsFor(s),open=s.tasks.filter(x=>x.st==='done');
  return `<div class="c"><h3>${t('jobs')}</h3>${jobs.length?jobs.map((j,i)=>`<div class="it"><span class="chip" style="background:${j.lv==='r'?'var(--red)':'var(--yellow)'}">${j.lv==='r'?'!':'·'}</span><div class="f"><b>${j.title}</b></div><button class="btn sm" onclick="doJob(${i})">📷</button></div>`).join(''):`<div class="sm mut">${t('noJobs')}</div>`}</div>
  ${open.length?`<div class="c"><h3>${t('waiting')}</h3>${open.map(x=>`<div class="it">${x.photo?`<img class="thumb" src="${x.photo}">`:'📸'}<div class="f sm"><b>${x.title||'Meter readings'}</b><br>${x.ts} · ${x.gps}</div><span class="chip" style="background:${x.q==='pending'?'var(--yellow)':'var(--teal)'}">${t(x.q)}</span></div>`).join('')}</div>`:''}
  ${isOff()?`<div class="note w">${t('savedPending')} SMS: JB ${s.id.replace('-','')} IN ${s.inf}</div>`:''}`}
 if(S.tab===1){return `<div class="c"><h3>${t('weekly')}</h3>
  <label>${t('ecQ')}</label><input id="ec" type="number" value="1180"><label>${t('ntuQ')}</label><input id="ntu" type="number" value="3"><label>${t('pondQ')}</label><input id="pond" type="number" value="640">
  <label>${t('vialQ')}</label><div class="seg"><button id="vy" class="on" onclick="vial('y')">${t('stayY')}</button><button id="vb" onclick="vial('b')">${t('black')}</button></div>
  <label>${t('arsQ')}</label><input id="ars" type="number" value="8"><div class="note w" style="margin-top:6px">${t('arsRule')}</div>
  <label>${t('inQ')}</label><input id="win" type="number" value="21"><label>${t('outQ')}</label><input id="wout" type="number" value="9">
  <div style="margin-top:12px"><button class="btn" onclick="saveTest()">${t('save')}</button></div></div>`}
 const tp=S.paid.filter(p=>p.n===s.ct&&p.f!=='Monthly pay').reduce((a,p)=>a+p.a,0);
 return `<div class="c" style="text-align:center"><div class="sm mut">${t('monthly')}</div><div style="font-size:32px;font-weight:800">Tk 4,333</div><div class="sm mut">Tk 52,000 / year</div></div>
 <div class="c"><div class="row sp"><h3 style="margin:0">${t('taskPay')}</h3><b>Tk ${tp}</b></div>${s.tasks.map(x=>`<div class="it"><div class="f sm">${x.title||'Meter readings'}</div><span class="chip" style="background:${x.st==='paid'?'var(--green)':'var(--yellow)'}">${x.st==='paid'?'paid':'checking'}</span></div>`).join('')}</div><div class="note">${t('minNote')}</div>`}
let V='y';function vial(v){V=v;$('vy').classList.toggle('on',v==='y');$('vb').classList.toggle('on',v==='b')}
function saveTest(){const s=site(),n=id=>+$(id).value;const x={date:'Now',ec:n('ec'),ntu:n('ntu'),pond:n('pond'),vial:V,ars:n('ars'),q:isOff()?'pending':'sent'};
 s.tests.push(x);s.lab=[];const bal=n('win')*s.rec-n('wout');s.days=Math.max(5,Math.round(s.days+bal/(capOf(s)*0.015)));
 save();render();const c=status(s).c;toast((isOff()?t('savedPending')+' ':'')+s.id+' → '+t(c))}
let JOB=null;function doJob(i){JOB=jobsFor(site())[i];$('photo').value='';$('photo').click()}
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const k=Math.max(120/img.width,120/img.height);c.getContext('2d').drawImage(img,(120-img.width*k)/2,(120-img.height*k)/2,img.width*k,img.height*k);addTask(c.toDataURL('image/jpeg',.6))};img.src=r.result};r.readAsDataURL(f)});
function addTask(photo){const s=site(),d=new Date();const x={id:S.nextId++,title:JOB.title,k:JOB.k,st:'done',photo,ts:d.toLocaleDateString()+' '+d.toTimeString().slice(0,5),gps:'GPS recorded',q:isOff()?'pending':'sent'};
 s.tasks.push(x);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{x.gps=p.coords.latitude.toFixed(2)+', '+p.coords.longitude.toFixed(2);save();render()},()=>{});save();render();toast(isOff()?t('savedPending'):t('waiting'))}

function supervisor(){navs([['✅','approve'],['🔬','lab'],['👪','hh']]);
 if(S.tab===0){const w=[];S.sites.forEach(s=>s.tasks.filter(x=>x.st==='done'&&x.q==='sent').forEach(x=>w.push([s,x])));
  return `<div class="c"><h3>${t('toCheck')}</h3>${w.length?w.map(([s,x])=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="row">${x.photo?`<img class="thumb" src="${x.photo}">`:'📸'}<div class="f"><b>${x.title||'Meter readings'}</b><div class="sm mut">${s.id} · ${s.ct}</div></div></div><div class="sm" style="margin-top:6px">📍 ${x.gps} ✓ &nbsp; 🕒 ${x.ts} ✓ &nbsp; ${s.id==='SAT-07'||s.id==='KHU-09'?'📡 sensor ✓':'👀 spot check'}</div>
  <div class="row" style="margin-top:8px"><button class="btn sm o" onclick="back2(${x.id})">${t('sendBack')}</button><button class="btn sm" style="flex:1" onclick="approveT('${s.id}',${x.id})">${t('spot')} · ${t('approvePay')}</button></div></div>`).join(''):`<div class="sm mut">${t('nothing')}</div>`}</div>`}
 if(S.tab===1)return `<div class="c"><h3>${t('labT')}</h3><label>${t('site')}</label><select id="ls">${S.sites.map(s=>`<option>${s.id}</option>`).join('')}</select>
  <label>${t('ars')} (µg/L)</label><input id="la" type="number" value="62"><label>${t('coli')}</label><input id="lc" type="number" value="0">
  <div class="note" style="margin-top:8px">${t('labNote')} ${t('arsRule')}</div><div style="margin-top:12px"><button class="btn" onclick="saveLab()">${t('save')}</button></div></div>`;
 const s=S.sites.find(x=>x.id===(S.hsite||'SAT-07')),cap=capOf(s),cnt=[1,2,3,4].map(p=>s.hh.filter(h=>h.prio===p).length);
 return `<div class="c"><select onchange="go({hsite:this.value})">${S.sites.map(x=>`<option ${x.id===s.id?'selected':''}>${x.id}</option>`).join('')}</select>
 <div class="row sp" style="margin-top:12px"><div><div class="sm mut">${t('cap')}</div><b style="font-size:24px">${cap} ${t('households')}</b></div><div style="text-align:right"><div class="sm mut">${t('reg')}</div><b style="font-size:24px">${s.hh.length}/${cap}</b></div></div>
 <div class="sm mut" style="margin-top:6px">${t('capNote')} (${s.inf} m³/day × ${Math.round(s.rec*100)}%)</div></div>
 <div class="c"><h3>${t('prio')}</h3>${[1,2,3,4].map((p,i)=>`<div class="it"><span class="chip" style="background:${p<4?'var(--teal)':'var(--grey)'}">${p}</span><div class="f">${t('p'+p)}</div><b>${cnt[i]}</b></div>`).join('')}
 <label>${t('prio')}</label><select id="np">${[1,2,3,4].map(p=>`<option value="${p}">${t('p'+p)}</option>`).join('')}</select><div style="margin-top:10px"><button class="btn" onclick="addHH('${s.id}')">${t('add')}</button></div></div>`}
function approveT(id,tid){const s=S.sites.find(x=>x.id===id),x=s.tasks.find(y=>y.id===tid);x.st='paid';if(x.k&&x.k.startsWith('iss_filt'))s.flow=92;if(x.k==='iss_pond'){const l=s.tests[s.tests.length-1];l.pond=600;l.ntu=3}
 S.paid.push({n:s.ct,a:150,f:x.title||'Meter readings'});save();render();toast('bKash: Tk 150 → '+s.ct)}
function back2(tid){S.sites.forEach(s=>s.tasks=s.tasks.filter(x=>x.id!==tid));save();render()}
function saveLab(){const s=S.sites.find(x=>x.id===$('ls').value);s.lab.push({date:'Now',ars:+$('la').value,coli:+$('lc').value});save();render();toast(s.id+' → '+t(status(s).c))}
function addHH(id){const s=S.sites.find(x=>x.id===id);if(s.hh.length>=capOf(s))return toast(t('full'));s.hh.push({card:100+s.hh.length,prio:+$('np').value,used:0});save();render();toast('✓')}

function vendor(){const s=site();navs([['🫙','deliveries'],['৳','levy']]);
 if(S.tab===0){const ok=status(s).c==='GREEN';return `${ok?'':`<div class="note w">${t('paused')}</div>`}<div class="c"><h3>${t('deliveries')}</h3>${s.orders.filter(o=>o.st==='new').map((o,i)=>`<div class="it">🫙<div class="f"><b>Card #${o.card}</b> · ${o.jars} jar</div><button class="btn sm" onclick="deliver(${s.orders.indexOf(o)})">${t('deliver')}</button></div>`).join('')||`<div class="sm mut">${t('none')}</div>`}</div>`}
 return `<div class="c"><div class="sm mut">${t('levyM')}</div><div style="font-size:28px;font-weight:800">Tk ${3*s.levyJars}</div><div class="sm">Tk 3 × ${s.levyJars} jars → ${t('hubFund')}</div></div>`}
function deliver(i){const s=site(),o=s.orders[i];o.st='done';s.levyJars+=o.jars;save();render();toast('Tk '+3*o.jars+' → '+t('hubFund'))}

function hub(){navs(null);const st=S.sites.map(s=>[s,status(s)]),n=c=>st.filter(x=>x[1].c===c).length;
 return `<div class="row">${['GREEN','YELLOW','RED'].map(c=>`<div class="c" style="flex:1;text-align:center;padding:10px"><b style="font-size:28px;color:${C[c]}">${n(c)}</b><div class="sm mut">${t(c)}</div></div>`).join('')}</div>
 <div class="c"><svg viewBox="0 0 360 150" width="100%"><rect x="2" y="2" width="356" height="146" rx="12" fill="#E3F8FA"/>${['Satkhira','Khulna','Bagerhat'].map((d,i)=>`<text x="${60+i*120}" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#555">${d}</text>`+(i?`<line x1="${i*120}" y1="10" x2="${i*120}" y2="140" stroke="#9EECF2" stroke-width="2"/>`:'')).join('')}${st.map(([s2,x],k)=>{const i=['Satkhira','Khulna','Bagerhat'].indexOf(s2.dist),j=st.filter(q=>q[0].dist===s2.dist).indexOf(st[k]);return `<circle cx="${40+i*120+j*40}" cy="${70+j*30}" r="11" fill="${C[x.c]}" stroke="#fff" stroke-width="3"/><text x="${40+i*120+j*40}" y="${98+j*30}" text-anchor="middle" font-size="10" font-weight="700">${s2.id}</text>`}).join('')}</svg></div>
 <div class="c"><h3>${t('allSites')}</h3>${st.map(([s,x])=>`<div class="it"><span class="dot" style="background:${C[x.c]}"></span><div class="f"><b>${s.id}</b> <span class="sm mut">· ${s.dist} · ${s.hh.length}/${capOf(s)} ${t('households')}</span></div><span class="sm mut">${s.days}d</span></div>`).join('')}</div>
 <div class="c"><h3>${t('alerts')}</h3>${st.flatMap(([s,x])=>x.iss.map(i=>`<div class="it"><span class="dot" style="background:${i[0]==='r'?'var(--red)':'var(--yellow)'}"></span><div class="f"><b>${s.id}</b> ${t(i[1])}</div></div>`)).join('')||`<div class="sm mut">${t('none')}</div>`}</div>
 <div class="c"><div class="row sp"><h3 style="margin:0">${t('minMode')}</h3><button class="btn sm ${S.min?'':'o'}" onclick="go({min:!S.min})">${S.min?'ON':'OFF'}</button></div><div class="sm mut" style="margin-top:6px">${S.min?t('minOn'):t('minOff')}</div></div>
 ${moneyCard()}`}

function render(){header();let h;
 if(!S.role)h=welcome();else if(S.role==='hub')h=hub();else if(!S.site||S.site==='ALL'){h=pick()}
 else h={family,caretaker,supervisor,vendor}[S.role]();
 if(S.role==='supervisor'&&(!S.site||S.site==='ALL')){S.site='SAT-07';h=supervisor()}
 $('main').innerHTML=h;document.documentElement.lang=S.lang;window.scrollTo(0,0)}
render();
</script>
</body>
</html>
